name: Release
on:
  push:
    tags: ['v*.*.*']
permissions:
  contents: read
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm install --global npm@11.21.0
      - name: Verify immutable tag matches package version
        shell: bash
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"
      - run: npm ci --ignore-scripts
      - run: npm run build
      - run: npm test
      - run: npm run coverage
      - run: npm run lint
      - run: npm audit --audit-level=high
      - run: npm run package:smoke
      - run: npm run action:check
      - run: git diff --exit-code -- dist package.json package-lock.json
      - name: Stage package for existing npm account approval
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if ! npm view "shopify-app-review-guard@$package_version" version >/dev/null 2>&1; then
            npm stage publish --provenance --access public
          fi
      - name: Require public package before creating release
        shell: bash
        run: |
          package_version=$(node -p "require('./package.json').version")
          if ! npm view "shopify-app-review-guard@$package_version" version >/dev/null 2>&1; then
            echo "::error::Package is staged and awaits npm account approval. Approve the staged package, then rerun this workflow."
            exit 1
          fi
      - name: Create new GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const version = JSON.parse(fs.readFileSync('package.json', 'utf8')).version;
          const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).find(part => part.startsWith(`${version}\n`));
          if (!section) throw new Error('Missing release notes for the package version');
          fs.writeFileSync('release-notes.md', `## ${section.trim()}\n`);
          NODE
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file release-notes.md --generate-notes
